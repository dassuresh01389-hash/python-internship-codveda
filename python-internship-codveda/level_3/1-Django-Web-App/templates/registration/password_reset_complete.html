{% extends "base.html" %}
{% block title %}Password Reset Complete | Task Manager{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm auth-card">
            <div class="card-body p-4 p-md-5 text-center">
                <i class="bi bi-check-circle display-4 text-success"></i>
                <h3 class="mt-3 fw-bold">Password Reset Complete</h3>
                <p class="text-muted">Your password has been changed successfully. You can now log in.</p>
                <a href="{% url 'login' %}" class="btn btn-primary mt-2">Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
